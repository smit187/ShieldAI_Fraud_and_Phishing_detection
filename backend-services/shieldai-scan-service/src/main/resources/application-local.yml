spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:scandb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # Disable Kafka consumer auto-startup so it doesn't fail trying to connect to a broker
  kafka:
    listener:
      auto-startup: false

# Disable Eureka registration for local run
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
